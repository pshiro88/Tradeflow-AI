services:
  db:
    image: postgres:16-alpine
    container_name: tradeflow-db
    environment:
      POSTGRES_USER: tradeflow
      POSTGRES_PASSWORD: tradeflow_dev_password
      POSTGRES_DB: tradeflow
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeflow -d tradeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
